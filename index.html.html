
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grammar Exercises by Dip Narayan Dahal </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background-color: #333;
    }
    nav button {
      background-color: #333;
      color: white;
      border: none;
      padding: 1rem;
      cursor: pointer;
      font-size: 1rem;
    }
    nav button:hover {
      background-color: #575757;
    }
    .content {
      padding: 2rem;
    }
    .exercise {
      background: white;
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }
    .answer {
      display: none;
      margin-top: 0.5rem;
      color: green;
    }
    .exercise button {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>English Grammar Exercises</header>
  <nav id="menu">
    <button onclick="loadExercises('Article')">Article</button>
    <button onclick="loadExercises('Tense')">Tense</button>
    <button onclick="loadExercises('Voice')">Voice</button>
    <button onclick="loadExercises('Preposition')">Preposition</button>
    <button onclick="loadExercises('Reported Speech')">Reported Speech</button>
    <button onclick="loadExercises('Tag')">Tag</button>
    <button onclick="loadExercises('If')">If</button>
    <button onclick="loadExercises('Causative Verb')">Causative Verb</button>
    <button onclick="loadExercises('Wh Conjunction')">Wh Conjunction</button>
    <button onclick="loadExercises('Reason Connection')">Reason Connection</button>
  </nav>
  <div class="content" id="exerciseArea">
    <p>Select a menu to see exercises.</p>
  </div>

  <script>
    const allExercises = {
      "Article": [
        ["He is ___ honest man.", "an"],
        ["I saw ___ elephant.", "an"],
        ["She is ___ best student.", "the"],
        ["I bought ___ book.", "a"],
        ["___ sun rises in the east.", "The"],
        ["He met ___ European lady.", "a"],
        ["___ apple a day keeps the doctor away.", "An"],
        ["___ moon looks beautiful tonight.", "The"],
        ["She wants to be ___ artist.", "an"],
        ["___ Ganga is a sacred river.", "The"]
      ],
      "Tense": [
        ["I ___ (go) to the market every day.", "go"],
        ["She ___ (be) studying for two hours.", "has been"],
        ["He ___ (write) a letter now.", "is writing"],
        ["We ___ (play) football last Saturday.", "played"],
        ["They ___ (live) in Nepal since 2010.", "have lived"],
        ["The book ___ (be) on the table.", "is"],
        ["I ___ (finish) my homework before dinner.", "will finish"],
        ["She ___ (watch) a movie right now.", "is watching"],
        ["By next year, he ___ (complete) his degree.", "will have completed"],
        ["They ___ (not understand) the question.", "do not understand"]
      ],
      "Voice": [
        ["The chef prepares the food.", "The food is prepared by the chef."],
        ["They are building a house.", "A house is being built by them."],
        ["She sang a song.", "A song was sung by her."],
        ["The teacher explained the lesson.", "The lesson was explained by the teacher."],
        ["We will finish the project tomorrow.", "The project will be finished by us tomorrow."],
        ["He gave me a book.", "I was given a book by him."],
        ["They will announce the results soon.", "The results will be announced soon."],
        ["She has completed the assignment.", "The assignment has been completed by her."],
        ["The storm damaged the house.", "The house was damaged by the storm."],
        ["They were discussing the problem.", "The problem was being discussed by them."]
      ],
      "Preposition": [
        ["She is interested ___ music.", "in"],
        ["The book is ___ the table.", "on"],
        ["He is good ___ playing tennis.", "at"],
        ["The cat jumped ___ the box.", "into"],
        ["I will meet you ___ 5 PM.", "at"],
        ["The picture is hanging ___ the wall.", "on"],
        ["They are sitting ___ the chair.", "on"],
        ["He is fond ___ painting.", "of"],
        ["The keys are ___ the drawer.", "in"],
        ["The train is running ___ time.", "on"]
      ],
      "Reported Speech": [
        ["She said, 'I am going to the store.'", "She said she was going to the store."],
        ["He said, 'I will come tomorrow.'", "He said he would come tomorrow."],
        ["They said, 'We have finished the task.'", "They said they had finished the task."],
        ["She asked, 'Do you like chocolate?'", "She asked if I liked chocolate."],
        ["He said, 'I am not feeling well.'", "He said he was not feeling well."],
        ["They said, 'We can help you.'", "They said they could help me."],
        ["She said, 'I am reading a book.'", "She said she was reading a book."],
        ["He asked, 'Are you coming to the party?'", "He asked if I was coming to the party."],
        ["They said, 'We will leave soon.'", "They said they would leave soon."],
        ["She said, 'I have been waiting for an hour.'", "She said she had been waiting for an hour."]
      ],
      "Tag": [
        ["You are coming to the party, ___?", "aren't you"],
        ["She doesn't like pizza, ___?", "does she"],
        ["They will arrive soon, ___?", "won't they"],
        ["He is a good student, ___?", "isn't he"],
        ["You can help me, ___?", "can't you"],
        ["It was a beautiful day, ___?", "wasn't it"],
        ["She has finished her homework, ___?", "hasn't she"],
        ["We should leave now, ___?", "shouldn't we"],
        ["You don't mind, ___?", "do you"],
        ["They aren't going to the concert, ___?", "are they"]
      ],
      "If": [
        ["If I ___ (be) you, I would go to the party.", "were"],
        ["If it ___ (rain), we will stay indoors.", "rains"],
        ["If he ___ (study) harder, he would pass the exam.", "studied"],
        ["If they ___ (invite) me, I would attend the wedding.", "invited"],
        ["If you ___ (not hurry), you'll miss the bus.", "don't hurry"],
        ["If she ___ (be) here, she would help us.", "were"],
        ["If I ___ (have) enough money, I would buy that car.", "had"],
        ["If we ___ (leave) earlier, we would have caught the train.", "had left"],
        ["If they ___ (work) harder, they would have finished on time.", "had worked"],
        ["If he ___ (not forget) the keys, he wouldn't be locked out.", "hadn't forgotten"]
      ],
      "Causative Verb": [
        ["She ___ (have) her car repaired yesterday.", "had"],
        ["I ___ (get) my hair cut every month.", "get"],
        ["They ___ (make) the house cleaned by professionals.", "made"],
        ["He ___ (have) the documents signed by the manager.", "had"],
        ["She ___ (get) her nails done for the wedding.", "got"],
        ["We ___ (make) them apologize for their behavior.", "made"],
        ["They ___ (get) the painting framed last week.", "got"],
        ["I ___ (have) my phone repaired after it broke.", "had"],
        ["He ___ (get) his teeth cleaned by the dentist.", "got"],
        ["She ___ (make) him write an apology letter.", "made"]
      ],
      "Wh Conjunction": [
        ["She told me ___ you were coming.", "that"],
        ["I don't know ___ he will be here.", "whether"],
        ["Can you tell me ___ the meeting is?", "when"],
        ["I wonder ___ she is feeling today.", "how"],
        ["Do you know ___ they live?", "where"],
        ["He didn't say ___ he was going.", "where"],
        ["I'm not sure ___ it will rain tomorrow.", "if"],
        ["I asked him ___ he could help me.", "whether"],
        ["Do you remember ___ you met him?", "when"],
        ["I want to know ___ the train leaves.", "what time"]
      ],
      "Reason Connection": [
        ["I was tired ___ I went to bed early.", "so"],
        ["He missed the bus ___ he woke up late.", "because"],
        ["She didn't go to the party ___ she was feeling sick.", "because"],
        ["They passed the test ___ they studied hard.", "because"],
        ["I stayed home ___ it was raining outside.", "because"],
        ["He was late ___ he got stuck in traffic.", "because"],
        ["She couldn't attend the meeting ___ she was on vacation.", "because"],
        ["We decided to leave early ___ we wanted to avoid traffic.", "because"],
        ["They canceled the event ___ the weather was bad.", "because"],
        ["I couldn't understand him ___ his accent.", "due to"],
        ["___ the heavy rain, we went to the event.", "Despite"],
        ["She stayed home ___ of her illness.", "because of"],
        ["We went hiking ___ the bad weather.", "in spite of"],
        ["I wanted to leave early, ___ I had to finish my work.", "however"],
        ["___ the rain, they decided to go for a walk.", "Although"]
      ]
    };

    function loadExercises(topic) {
      const area = document.getElementById('exerciseArea');
      const exercises = allExercises[topic];
      if (!exercises) {
        area.innerHTML = `<p>No exercises found for ${topic}.</p>`;
        return;
      }
      let html = `<h2>${topic} Exercises</h2>`;
      exercises.forEach((ex, index) => {
        html += `
          <div class="exercise">
            <p><strong>${index + 1}.</strong> ${ex[0]}</p>
            <button onclick="document.getElementById('ans${index}').style.display='block'">Show Answer</button>
            <p class="answer" id="ans${index}"><strong>Answer:</strong> ${ex[1]}</p>
          </div>`;
      });
      area.innerHTML = html;
    }
  </script>
</body>
</html>
